name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JS-syntaxis checken
        run: node --check vijver.js
      - name: JSON-bestanden valideren
        run: node -e "for (const f of ['manifest.json', 'vijver-logboek.json']) JSON.parse(require('fs').readFileSync(f, 'utf8'))"
